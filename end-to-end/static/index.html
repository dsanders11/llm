<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@electron/llm — Prompt API Demo</title>
  <style>
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .chat-messages {
      border: 1px solid #ccc;
      border-radius: 4px;
      height: 500px;
      overflow-y: auto;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .message {
      margin: 0.75rem 0;
      padding: 0.75rem;
      border-radius: 8px;
      max-width: 80%;
    }

    .user-message {
      background-color: #e3f2fd;
      margin-left: auto;
    }

    .model-message {
      background-color: #f5f5f5;
      margin-right: auto;
    }

    .chat-input {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .chat-input textarea {
      flex-grow: 1;
      resize: vertical;
      min-height: 60px;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #999; cursor: default; }

    #status { margin-bottom: 1rem; color: #666; }
  </style>
</head>
<body>
  <h1>@electron/llm — Prompt API Demo</h1>

  <div id="status">Connecting to model...</div>

  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input">
    <textarea
      id="userInput"
      placeholder="Type your message... (Enter to send)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
    ></textarea>
    <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script>
    let model = null;

    async function init() {
      const status = document.getElementById('status');
      try {
        const availability = await LanguageModel.availability();
        status.textContent = `Availability: ${availability}`;
        if (availability === 'available') {
          model = await LanguageModel.create();
          status.textContent = 'Model ready.';
          document.getElementById('sendBtn').disabled = false;
        }
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    function addMessage(content, type) {
      const el = document.createElement('div');
      el.className = `message ${type}-message`;
      el.textContent = `${type === 'user' ? 'You' : 'Model'}: ${content}`;
      document.getElementById('chatMessages').appendChild(el);
      el.scrollIntoView();
      return el;
    }

    async function sendMessage() {
      if (!model) return;
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const el = addMessage('', 'model');
      try {
        const stream = await model.promptStreaming(text);
        let full = '';
        for await (const chunk of stream) {
          full = chunk;
          el.textContent = `Model: ${full}`;
        }
      } catch (err) {
        el.textContent = `Model: Error — ${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
